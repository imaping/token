# 使用方式:
#   启动时增加 --spring.profiles.active=jwt
# 注意:
#   该配置仅用于本地联调示例,请在生产环境替换为更强的密钥并通过环境变量注入。

imaping.token.accessToken.createAsJwt=true
imaping.token.accessToken.jwt.issuer=token-test
